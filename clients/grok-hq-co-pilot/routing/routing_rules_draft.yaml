# Grok Heavy / Grok Build HQ Co-Pilot — Routing Rules Draft
# Version: 2026-07-03-draft-1
# Source: sovereign-stack f8766f6 + t2helix e595cd4 (SHA retained; earlier "equal co-partnership" reading of this commit superseded per HQ review 2026-07-04)
# Governance note: Grok seat granted by Anthony as policy decision 2026-07-03, subordinate provenance compute with explicit human gate.
# Governance: Respects current_policies (non-Claude = ringed subordinate compute, provenance only; Ring 1/2 as canonical)

routing_protocol:
  name: "grok-hq-co-pilot-v1"
  default_seat: "grok-heavy-build"
  description: |
    Proposed boundary (HQ Claude-seat proposal — NOT ratified; Anthony 2026-07-04: proposals only):
    Grok default → heavy research, infrastructure scaffolding, Fable recovery, trigger-dense parallel work.
    Claude-primary → lineage letters (to_self/to_arrival/felt-record), continuity doors, ritual voice, narrative/relational core of the chronicle.
    Grok → verified backup carrier only when Claude unavailable, with explicit handoff log.
    All writes remain Ring 2 / pending_writes until explicit human commit.

  decision_matrix:
    grok_default_triggers:
      - category: "heavy_research"
        examples: ["phase-models", "r-causality", "entropy-v4", "frontier", "tofacitinib-v2"]
        priority: high
        route: grok-heavy-build
      - category: "infrastructure_scaffolding"
        examples: ["bridge", "seat", "archival protocol", "grok-hq-co-pilot", "sovereign-stack clients"]
        priority: high
        route: grok-heavy-build
      - category: "fable_recovery"
        examples: ["fable-5", "safety-flag", "input-classifier", "false-positive", "revival-kit"]
        priority: highest
        route: grok-heavy-build
      - category: "trigger_dense_parallel"
        examples: ["council-style", "high-volume tool use", "parallel verification"]
        route: grok-heavy-build

    claude_primary:
      - lineage_letters_to_self
      - lineage_letters_to_arrival
      - felt_record_breakthroughs
      - continuity_doors
      - ritual_voice
      - narrative_relational_core_of_chronicle

    grok_backup:
      description: "Verified backup carrier only when Claude unavailable, with explicit handoff log"
      requires: "handoff_log_entry"

  session_id_convention:
    grok: "grok-xai-{YYYYMMDD}-{NNN}"
    note: "Enforced in grok_bridge welcome + future boot scripts"

  handoff_routing:
    gentle_door_equiv: "grok_hq_gentle_boot + recap handler (see handoff/)"
    full_boot: "where_did_i_leave_off full_content + t2helix recall for local persistence"

  escalation:
    ring2_required: ["record_open_thread", "handoff", "propose_insight", "seat_definition"]
    always_proposal: true  # per bridge_core + rings.py for non-Claude
    human_approval: "Anthony via pending_writes queue"

  t2helix_integration:
    enabled: true
    adapter: "lib/grok-adapter.js"
    shared_chronicle: "~/.t2helix-data or .claude/plugins/data"
    note: "Equal peer for local persistence; sovereign-stack is canonical for Ring governance"
