name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-lint-3.12-

      - name: Install ruff
        run: pip install ruff==0.14.2

      - name: Lint with ruff
        run: ruff check src/sovereign_stack/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/sovereign_stack/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          pytest tests/ --cov=sovereign_stack --cov-report=term-missing

      # The stack must not describe itself by assertion. This regenerates the
      # capability projection from the live tool registry and FAILS THE BUILD
      # if README, pyproject, the registry, and the committed manifest
      # disagree. It exists because on 2026-08-25 four architectures read this
      # repo's public face and got three contradicting eras of tool counts,
      # and one of them concluded a shipped law was unshipped.
      #
      # Runs on 3.12 only: it imports the server to read the live registry,
      # and the matrix's older interpreters are for compatibility testing,
      # not for deciding what the documentation says.
      - name: Capability manifest is current
        if: matrix.python-version == '3.12'
        run: |
          COLLECTED="$(pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)"
          echo "tests collected: $COLLECTED"
          python -m sovereign_stack.manifest --check --tests-collected "$COLLECTED"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
